# 배포 — **직접 부를 수 없는 파일**
#
# 여기에는 `workflow_call` 밖에 없다. `workflow_dispatch` 도 `push` 도 없으므로
# Actions 탭에 뜨지 않고 `gh workflow run` 으로도 못 부른다. 배포에 닿는 길은
# `deploy-trigger.yml` 하나뿐이고, 그 길에는 **main 조상 확인**과 **gate 초록
# 확인**이 박혀 있다.
#
# 시크릿은 `production` 환경에 둔다. 저장소 시크릿으로 두면 이 저장소의 **어떤**
# 워크플로든 참조할 수 있다 — 그건 지금까지 `CLOUDFLARE_API_TOKEN` 이 있던 자리다.

name: Deploy

on:
    workflow_call:
        inputs:
            sha:
                required: true
                type: string
        # **부르는 쪽이 명시적으로 넘겨야 한다.**
        #
        # 호출된 재사용 워크플로의 `secrets` 컨텍스트에는 여기 선언되고 실제로 전달된 것만
        # 들어온다. 잡에 `environment:` 를 달아도 그것이 채워주지는 않는다 — 그 키는 승인
        # 게이트와 deployment 기록을 담당한다. 선언 없이 `secrets.FOO` 를 쓰면 **빈 문자열**이
        # 되고, wrangler 는 그것을 "설정 파싱 오류" 로 보고해 원인이 엉뚱한 곳을 가리킨다.
        #
        # `secrets: inherit` 을 쓰지 않는 이유는 그대로다 — 저장소의 모든 시크릿을 통째로
        # 넘기면 이 파일이 무엇에 닿는지 읽어서 알 수 없게 된다. 필요한 것만 이름으로 받는다.
        secrets:
            CLOUDFLARE_API_TOKEN:
                required: true
            CLOUDFLARE_ACCOUNT_ID:
                required: true
            WRANGLER_JSONC:
                required: true
            # 캐시 퍼지 전용 — 없으면 퍼지만 건너뛴다.
            CLOUDFLARE_ZONE_ID:
                required: false

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    deploy:
        name: Deploy to Cloudflare
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # **여기부터 되돌릴 수 없다.** 승인자와 배포 브랜치 제한이 붙는 자리다.
        #
        # ⚠️ 시크릿은 이 환경에서 오지 않는다. 호출된 재사용 워크플로에서는 `environment:`
        #    가 `secrets` 컨텍스트를 채우지 않는다 — 위 `on.workflow_call.secrets` 에
        #    선언하고 `deploy-trigger.yml` 이 넘겨준 것만 들어온다. 따라서 이 값들은
        #    **저장소(또는 조직) 시크릿**이어야 한다. 환경 시크릿에만 넣어 두면 빈 값이 된다.
        environment:
            name: production
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # 트리거가 확정한 커밋을 그대로 세운다. 브랜치 이름으로 받으면
                  # 판정한 것과 배포하는 것이 갈릴 수 있다.
                  ref: ${{ inputs.sha }}
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # **시크릿이 비어 있는지 여기서 잡는다.** 비어 있으면 wrangler 가
            # `ValueExpected` 라는 파싱 오류만 내놓아서, 원인이 "설정이 잘못됐다" 처럼
            # 보인다 — 실제로는 시크릿이 안 풀린 것이다. 그 둘을 구분하는 데 시간이 든다.
            #
            # 값은 절대 찍지 않는다. **길이만** 본다 — 존재 여부를 가리는 데는 그것으로 충분하고,
            # 길이는 마스킹을 우회해 값을 흘리지 않는다.
            #
            # 이 워크플로는 `uses:` 로 불리는 재사용 워크플로다. `secrets` 컨텍스트에는
            # `on.workflow_call.secrets` 에 선언되고 부르는 쪽이 넘긴 것만 들어온다.
            - name: 배포에 필요한 시크릿이 실제로 채워졌나
              env:
                  WRANGLER_JSONC: ${{ secrets.WRANGLER_JSONC }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
              run: |
                  set -euo pipefail
                  missing=0
                  for name in WRANGLER_JSONC CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
                    # bash 간접 확장 — eval 을 쓰지 않는다(값이 셸에 해석될 여지를 만들지 않는다).
                    value="${!name:-}"
                    len="${#value}"
                    if [ "$len" -eq 0 ]; then
                      echo "::error::$name 시크릿이 비어 있습니다 — **저장소 시크릿**(Settings → Secrets and variables → Actions)에 넣고, deploy-trigger.yml 이 이 이름으로 넘기는지 확인하세요. 환경 시크릿에만 두면 재사용 워크플로에는 빈 값으로 도착합니다."
                      missing=1
                    else
                      echo "  $name: 길이 ${len}자"
                    fi
                  done
                  # zone id 는 캐시 퍼지에만 쓰이고 없어도 배포는 된다.
                  if [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
                    echo "::warning::CLOUDFLARE_ZONE_ID 가 없어 배포 후 캐시 퍼지를 건너뜁니다."
                  fi
                  test "$missing" = "0" || exit 1

            - name: Setup Wrangler config
              env:
                  WRANGLER_JSONC: ${{ secrets.WRANGLER_JSONC }}
              run: |
                  set -euo pipefail
                  printf '%s' "$WRANGLER_JSONC" > wrangler.jsonc
                  # 빈 파일이면 wrangler 가 `ValueExpected` 만 내놓아 원인이 흐려진다.
                  # 여기서 끊으면 다음 단계의 파싱 오류는 "정말 설정이 잘못된 것" 으로 좁혀진다.
                  # 내용 검증은 하지 않는다 — jsonc(주석·trailing comma)를 직접 파싱하려 들면
                  # 정상 설정을 막을 위험이 있고, 바로 다음 `wrangler types` 가 이미 검증한다.
                  test -s wrangler.jsonc || { echo "::error::wrangler.jsonc 가 비어 있습니다 (저장소 시크릿 WRANGLER_JSONC 확인)"; exit 1; }
                  echo "  wrangler.jsonc: $(wc -c < wrangler.jsonc | tr -d ' ') 바이트"

            - name: Generate Wrangler types
              run: bunx wrangler types
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

            - name: Build
              run: bun run build
              env:
                  DB_DIALECT: postgres
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

            - name: Deploy
              run: bunx wrangler deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

            - name: Purge Cloudflare cache
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
              run: |
                  if [ -z "$CLOUDFLARE_ZONE_ID" ]; then
                    echo "::warning::CLOUDFLARE_ZONE_ID 시크릿이 없어 캐시 퍼지를 건너뜁니다 — 배포 후에도 Cloudflare 엣지가 구 자산을 계속 서빙할 수 있습니다."
                    exit 0
                  fi
                  PURGE_RESP=$(curl -s -X POST \
                    "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
                    -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                    -H "Content-Type: application/json" \
                    --data '{"purge_everything":true}')
                  echo "$PURGE_RESP" | jq -c '.'
                  if [ "$(echo "$PURGE_RESP" | jq -r '.success')" != "true" ]; then
                    echo "::warning::캐시 퍼지 실패: $(echo "$PURGE_RESP" | jq -c '.errors')"
                  fi
