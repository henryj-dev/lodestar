name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: false

# 최소 권한 — 배포는 Cloudflare 토큰으로 수행하며 GITHUB_TOKEN 은 체크아웃에만 쓴다.
permissions:
    contents: read

env:
    # 2026-06-02부터 Actions 런타임이 Node 24로 강제 전환됨. 선제 opt-in으로
    # actions/checkout 외 dorny/paths-filter 등 미업그레이드 액션도 Node 24에서 실행
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    check-changes:
        name: Check Changed Files
        runs-on: ubuntu-latest
        outputs:
            build-affected: ${{ steps.filter.outputs.build-affected }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Filter paths
              uses: dorny/paths-filter@v4
              id: filter
              with:
                  filters: |
                      build-affected:
                        - "src/**"
                        - "static/**"
                        - "drizzle/**"
                        - "package.json"
                        - "bun.lock"
                        - "bunfig.toml"
                        - "vite.config.*"
                        - "svelte.config.*"
                        - "tsconfig.json"
                        - "wrangler.jsonc"
                        - "wrangler.example.jsonc"
                        - "drizzle.config.*"
                        - "eslint.config.*"
                        - ".prettierrc*"

    deploy:
        name: Deploy to Cloudflare
        runs-on: ubuntu-latest
        needs: check-changes
        if: needs.check-changes.outputs.build-affected == 'true' || github.event_name == 'workflow_dispatch'
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              # 락파일과 다른 트리가 프로덕션에 나가는 것을 막는다. (ci.yml 과 동일)
              run: bun install --frozen-lockfile

            - name: Setup Wrangler config
              env:
                  WRANGLER_JSONC: ${{ secrets.WRANGLER_JSONC }}
              run: printf '%s' "$WRANGLER_JSONC" > wrangler.jsonc

            - name: Generate Wrangler types
              run: bunx wrangler types
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

            - name: Build
              run: bun run build
              env:
                  # postgres 방언 선택 — vite/svelte config 가 빌드 시점에 스키마·드라이버를
                  # 선택하므로 반드시 빌드 env 로 지정해야 한다 (미설정 시 d1 로 번들링됨).
                  DB_DIALECT: postgres
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

            - name: Deploy
              run: bunx wrangler deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

            - name: Purge Cloudflare cache
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
              run: |
                  if [ -z "$CLOUDFLARE_ZONE_ID" ]; then
                    echo "::warning::CLOUDFLARE_ZONE_ID 시크릿이 없어 캐시 퍼지를 건너뜁니다 — 배포 후에도 Cloudflare 엣지가 구 자산을 계속 서빙할 수 있습니다."
                    exit 0
                  fi
                  PURGE_RESP=$(curl -s -X POST \
                    "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
                    -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                    -H "Content-Type: application/json" \
                    --data '{"purge_everything":true}')
                  echo "$PURGE_RESP" | jq -c '.'
                  if [ "$(echo "$PURGE_RESP" | jq -r '.success')" != "true" ]; then
                    echo "::warning::캐시 퍼지 실패: $(echo "$PURGE_RESP" | jq -c '.errors')"
                  fi
