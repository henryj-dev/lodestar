# 배포 — **직접 부를 수 없는 파일**
#
# 여기에는 `workflow_call` 밖에 없다. `workflow_dispatch` 도 `push` 도 없으므로
# Actions 탭에 뜨지 않고 `gh workflow run` 으로도 못 부른다. 배포에 닿는 길은
# `deploy-trigger.yml` 하나뿐이고, 그 길에는 **main 조상 확인**과 **gate 초록
# 확인**이 박혀 있다.
#
# 시크릿은 `production` 환경에 둔다. 저장소 시크릿으로 두면 이 저장소의 **어떤**
# 워크플로든 참조할 수 있다 — 그건 지금까지 `CLOUDFLARE_API_TOKEN` 이 있던 자리다.

name: Deploy

on:
    workflow_call:
        inputs:
            sha:
                required: true
                type: string

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    deploy:
        name: Deploy to Cloudflare
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # **여기부터 되돌릴 수 없다.** 승인자·배포 브랜치 제한·시크릿이 붙는 자리다.
        #
        # ⚠️ `CLOUDFLARE_API_TOKEN` · `CLOUDFLARE_ACCOUNT_ID` · `CLOUDFLARE_ZONE_ID` ·
        #    `WRANGLER_JSONC` 는 **이 환경의 시크릿이어야 한다.** 저장소 시크릿으로
        #    두면 부르는 쪽이 `secrets: inherit` 을 해야 풀리고, 그러면 이 파일이
        #    무엇에 닿는지가 다시 흐려진다.
        environment:
            name: production
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # 트리거가 확정한 커밋을 그대로 세운다. 브랜치 이름으로 받으면
                  # 판정한 것과 배포하는 것이 갈릴 수 있다.
                  ref: ${{ inputs.sha }}
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # **시크릿이 비어 있는지 여기서 잡는다.** 비어 있으면 wrangler 가
            # `ValueExpected` 라는 파싱 오류만 내놓아서, 원인이 "설정이 잘못됐다" 처럼
            # 보인다 — 실제로는 시크릿이 안 풀린 것이다. 그 둘을 구분하는 데 시간이 든다.
            #
            # 값은 절대 찍지 않는다. **길이만** 본다 — 존재 여부를 가리는 데는 그것으로 충분하고,
            # 길이는 마스킹을 우회해 값을 흘리지 않는다.
            #
            # 이 워크플로는 `uses:` 로 불리는 재사용 워크플로다. 저장소 시크릿은 부르는 쪽이
            # `secrets: inherit` 을 하지 않으면 전달되지 않으므로, 여기 필요한 것들은
            # **`production` 환경의 시크릿**이어야 한다(저장소 시크릿으로 두면 빈 값이 된다).
            - name: 배포에 필요한 시크릿이 실제로 채워졌나
              env:
                  WRANGLER_JSONC: ${{ secrets.WRANGLER_JSONC }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
              run: |
                  set -euo pipefail
                  missing=0
                  for name in WRANGLER_JSONC CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
                    # bash 간접 확장 — eval 을 쓰지 않는다(값이 셸에 해석될 여지를 만들지 않는다).
                    value="${!name:-}"
                    len="${#value}"
                    if [ "$len" -eq 0 ]; then
                      echo "::error::$name 시크릿이 비어 있습니다 — 저장소 시크릿이 아니라 **production 환경 시크릿**으로 설정해야 합니다 (Settings → Environments → production → Environment secrets)."
                      missing=1
                    else
                      echo "  $name: 길이 ${len}자"
                    fi
                  done
                  # zone id 는 캐시 퍼지에만 쓰이고 없어도 배포는 된다.
                  if [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
                    echo "::warning::CLOUDFLARE_ZONE_ID 가 없어 배포 후 캐시 퍼지를 건너뜁니다."
                  fi
                  test "$missing" = "0" || exit 1

            - name: Setup Wrangler config
              env:
                  WRANGLER_JSONC: ${{ secrets.WRANGLER_JSONC }}
              run: |
                  set -euo pipefail
                  printf '%s' "$WRANGLER_JSONC" > wrangler.jsonc
                  # 빈 파일이면 wrangler 가 `ValueExpected` 만 내놓아 원인이 흐려진다.
                  # 여기서 끊으면 다음 단계의 파싱 오류는 "정말 설정이 잘못된 것" 으로 좁혀진다.
                  # 내용 검증은 하지 않는다 — jsonc(주석·trailing comma)를 직접 파싱하려 들면
                  # 정상 설정을 막을 위험이 있고, 바로 다음 `wrangler types` 가 이미 검증한다.
                  test -s wrangler.jsonc || { echo "::error::wrangler.jsonc 가 비어 있습니다 (production 환경의 WRANGLER_JSONC 시크릿 확인)"; exit 1; }
                  echo "  wrangler.jsonc: $(wc -c < wrangler.jsonc | tr -d ' ') 바이트"

            - name: Generate Wrangler types
              run: bunx wrangler types
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

            - name: Build
              run: bun run build
              env:
                  DB_DIALECT: postgres
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

            - name: Deploy
              run: bunx wrangler deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

            - name: Purge Cloudflare cache
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
              run: |
                  if [ -z "$CLOUDFLARE_ZONE_ID" ]; then
                    echo "::warning::CLOUDFLARE_ZONE_ID 시크릿이 없어 캐시 퍼지를 건너뜁니다 — 배포 후에도 Cloudflare 엣지가 구 자산을 계속 서빙할 수 있습니다."
                    exit 0
                  fi
                  PURGE_RESP=$(curl -s -X POST \
                    "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
                    -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                    -H "Content-Type: application/json" \
                    --data '{"purge_everything":true}')
                  echo "$PURGE_RESP" | jq -c '.'
                  if [ "$(echo "$PURGE_RESP" | jq -r '.success')" != "true" ]; then
                    echo "::warning::캐시 퍼지 실패: $(echo "$PURGE_RESP" | jq -c '.errors')"
                  fi
