name: CI

on:
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.head_ref }}
    cancel-in-progress: true

# 최소 권한. pull-requests:read 는 dorny/paths-filter 가 PR 이벤트에서
# 변경 파일 목록을 REST API 로 조회하는 데 필요하다(체크아웃만으로는 부족).
permissions:
    contents: read
    pull-requests: read

jobs:
    check-changes:
        name: Check Changed Files
        runs-on: ubuntu-latest
        outputs:
            build-affected: ${{ steps.filter.outputs.build-affected }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Filter paths
              uses: dorny/paths-filter@v4
              id: filter
              with:
                  filters: |
                      build-affected:
                        - "src/**"
                        - "test/**"
                        - "static/**"
                        - "drizzle/**"
                        - "vitest.config.*"
                        - "package.json"
                        - "bun.lock"
                        - "bunfig.toml"
                        - "vite.config.*"
                        - "svelte.config.*"
                        - "tsconfig.json"
                        - "wrangler.jsonc"
                        - "wrangler.example.jsonc"
                        - "drizzle.config.*"
                        - "eslint.config.*"
                        - ".prettierrc*"

    ci:
        name: Lint, Type Check & Build
        runs-on: ubuntu-latest
        needs: check-changes
        if: needs.check-changes.outputs.build-affected == 'true'

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref }}

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              # bun 은 CI 환경에서도 frozen lockfile 을 자동 적용하지 않는다(1.3.x 실측).
              # 명시하지 않으면 bun.lock 을 갱신해 버려 락파일 드리프트가 CI 를 통과한다.
              run: bun install --frozen-lockfile

            - name: Audit dependencies
              run: bun audit --audit-level=high

            - name: Setup Wrangler config
              run: cp wrangler.example.jsonc wrangler.jsonc

            - name: Generate Wrangler types
              run: bunx wrangler types

            - name: Lint
              run: bun run lint

            - name: Type Check
              run: bun run check

            - name: Test
              run: bun run test

            - name: Migration drift check
              run: |
                  bun run db:generate:all
                  if ! git diff --exit-code -- drizzle; then
                    echo "::error::스키마가 변경되었으나 마이그레이션이 생성되지 않았습니다. 'bun run db:generate:all' 실행 후 drizzle*/ 변경분을 커밋하세요." >&2
                    exit 1
                  fi

            - name: Build
              run: bun run build

    required:
        name: CI Required
        runs-on: ubuntu-latest
        needs: [check-changes, ci]
        if: always()
        steps:
            - name: Check result
              run: |
                  # check-changes 가 실패하면 build-affected 가 빈 문자열이 되어 아래 조건이
                  # 거짓이 된다. 그대로 두면 CI 가 한 번도 돌지 않은 채 필수 체크가 통과한다.
                  if [[ "${{ needs.check-changes.result }}" != "success" ]]; then
                    echo "::error::변경 파일 판별(check-changes)이 '${{ needs.check-changes.result }}' 로 끝났습니다 — CI 통과 여부를 확인할 수 없습니다."
                    exit 1
                  fi
                  if [[ "${{ needs.check-changes.outputs.build-affected }}" == "true" && "${{ needs.ci.result }}" != "success" ]]; then
                    echo "CI failed"
                    exit 1
                  fi
                  echo "CI passed or skipped"
