name: CI

on:
    pull_request:
        branches: [main]
    # **main 에서도 돈다.** squash 머지는 PR 에서 돈 적이 없는 **새 커밋**을 만든다.
    # 그 커밋에 판정이 없으면 배포 트리거가 "이 커밋의 gate 가 초록이었나" 를 물을
    # 대상이 없고, 머지된 결과 자체는 아무도 검사하지 않은 채로 남는다.
    push:
        branches: [main]
    # **코드가 안 변해도 판정은 변한다.** 부동 태그로 받는 이미지가 바뀌고, 스캐너에 새
    # 규칙이 붙고, 어제까지 조용하던 자리가 오늘 잡힌다. push 와 PR 로만 도는 게이트는
    # 그 변화를 **다음 커밋이 올 때까지** 못 본다 — 그리고 그때 빨개지면 원인을 그 커밋
    # 에서 찾게 된다. 주 1회 같은 커밋을 다시 재서 원인을 날짜로 갈라 놓는다.
    schedule:
        - cron: "13 5 * * 3"

# 최소 권한. pull-requests:read 는 dorny/paths-filter 가 PR 이벤트에서
# 변경 파일 목록을 REST API 로 조회하는 데 필요하다(체크아웃만으로는 부족).
permissions:
    contents: read
    pull-requests: read

jobs:
    check-changes:
        name: Check Changed Files
        runs-on: ubuntu-latest
        outputs:
            # **주간 실행에는 견줄 기준이 없다.** paths-filter 는 "무엇이 바뀌었나" 를
            # 묻는데 schedule 이벤트에는 비교 대상이 없다 — 그대로 두면 주간 실행이
            # ci 를 건너뛰고 게이트만 초록으로 지나간다. 재실행의 요점은 *같은 커밋을
            # 다시 재는 것*이므로, 그때는 무조건 돈다.
            build-affected: ${{ github.event_name == 'schedule' && 'true' || steps.filter.outputs.build-affected }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Filter paths
              if: github.event_name != 'schedule'
              uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              id: filter
              with:
                  filters: |
                      build-affected:
                        - "src/**"
                        - "test/**"
                        - "static/**"
                        - "drizzle/**"
                        - "vitest.config.*"
                        - "package.json"
                        - "bun.lock"
                        - "bunfig.toml"
                        - "vite.config.*"
                        - "svelte.config.*"
                        - "tsconfig.json"
                        - "wrangler.jsonc"
                        - "wrangler.example.jsonc"
                        - "drizzle.config.*"
                        - "eslint.config.*"
                        - ".prettierrc*"

    ci:
        name: Lint, Type Check & Build
        runs-on: ubuntu-latest
        needs: check-changes
        if: needs.check-changes.outputs.build-affected == 'true'

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # PR 이면 그 가지의 끝, push 면 밀린 커밋. `github.head_ref` 는
                  # push 이벤트에서 비어 있다.
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            - name: Install dependencies
              # bun 은 CI 환경에서도 frozen lockfile 을 자동 적용하지 않는다(1.3.x 실측).
              # 명시하지 않으면 bun.lock 을 갱신해 버려 락파일 드리프트가 CI 를 통과한다.
              run: bun install --frozen-lockfile

            - name: Audit dependencies
              run: bun audit --audit-level=high

            - name: Setup Wrangler config
              run: cp wrangler.example.jsonc wrangler.jsonc

            - name: Generate Wrangler types
              run: bunx wrangler types

            - name: Lint
              run: bun run lint

            - name: Type Check
              run: bun run check

            - name: Test
              run: bun run test

            - name: Migration drift check
              run: |
                  bun run db:generate:all
                  if ! git diff --exit-code -- drizzle; then
                    echo "::error::스키마가 변경되었으나 마이그레이션이 생성되지 않았습니다. 'bun run db:generate:all' 실행 후 drizzle*/ 변경분을 커밋하세요." >&2
                    exit 1
                  fi

            - name: Build
              run: bun run build

    # **정책 층은 이 저장소 것이 아니다.** 자격증명·워크플로 감사·의존성 리뷰는 이 저장소가
    # 무엇을 만드는지와 무관하게 다섯 저장소가 같은 것을 묻는 축이다. 복제해 들고 있으면
    # 같은 상태가 유지된다는 보장이 없고, 갈라지기 시작하면 어느 쪽이 기준인지 알 수 없다.
    #
    # 재사용 워크플로는 **부르는 저장소의 맥락에서** 돈다 — 체크아웃도 이 저장소를 받고
    # `.gitleaks.toml` 도 이쪽 것을 읽는다. 예외 목록은 각자 자기 근거와 함께 갖는다.
    #
    # ⚠️ 커밋 SHA 로 박는다. `@main` 이면 저쪽 파일 한 줄이 이 저장소의 게이트를 바꾼다.
    #    dependabot 이 이 SHA 를 갱신한다.
    policy:
        uses: henryj-dev/.github/.github/workflows/policy-checks.yml@f8eab7393216bd0054e6b65297a0cc5baa865630
        permissions:
            contents: read
            # dependency-review 가 무엇이 왜 막혔는지 PR 안에 적는다.
            pull-requests: write
        secrets:
            # 조직 소유 저장소는 gitleaks-action 라이선스가 필수다. org 시크릿에 있다.
            GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

    # **브랜치 규칙이 거는 이름은 이것 하나다.**
    #
    # 잡 이름을 규칙에 직접 적으면 이름이 바뀌는 날 그 체크는 "존재하지 않는 체크" 가
    # 되고, 보호는 조용히 사라진다 — GitHub 은 그때 아무 말도 하지 않는다. 여기서
    # 모아 받으면 잡의 증감이 `needs:` 한 줄로 끝나고, 규칙은 안 건드린다.
    gate:
        name: gate
        runs-on: ubuntu-latest
        needs: [check-changes, ci, policy]
        # 선행 잡이 빨개도 이 잡은 돌아야 한다. 안 그러면 "돌지 않은 체크" 가 되어
        # 규칙이 기다리기만 하고, 무엇이 깨졌는지는 아무 데도 안 적힌다.
        if: always()
        timeout-minutes: 5
        steps:
            - name: 선행 잡 판정
              # `${{ }}` 를 `run:` 본문에 박지 않는다 — 그 자리는 셸이 스크립트를 보기
              # 전에 통째로 치환되므로, 값에 따옴표나 `$(...)` 가 섞이면 그대로 셸
              # 코드가 된다.
              env:
                  NEEDS: ${{ toJSON(needs) }}
                  BUILD_AFFECTED: ${{ needs.check-changes.outputs.build-affected }}
              run: |
                  set -euo pipefail
                  jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<<"$NEEDS"

                  # **건너뛸지를 정하는 잡은 반드시 성공해야 한다.** 이게 빨가면
                  # build-affected 가 비고, 그러면 ci 가 조용히 건너뛴 것을 "해당 없음"
                  # 으로 읽게 된다 — 검사를 안 한 것이 통과로 둔갑한다.
                  cc="$(jq -r '."check-changes".result' <<<"$NEEDS")"
                  test "$cc" = "success" \
                    || { echo "::error::변경 파일 판별이 '$cc' 로 끝났다 — 통과 여부를 알 수 없다"; exit 1; }

                  # 빌드에 영향이 있다고 판별했는데 ci 가 안 돌았다면 그건 스킵이 아니라 사고다.
                  if [ "$BUILD_AFFECTED" = "true" ]; then
                    ci="$(jq -r '.ci.result' <<<"$NEEDS")"
                    test "$ci" = "success" \
                      || { echo "::error::빌드 영향이 있는데 ci 가 '$ci' 다"; exit 1; }
                  fi

                  # skipped 는 통과로 본다 — 이 이벤트에 해당하지 않는 잡이 있다(예: PR
                  # 에서만 뜻이 있는 의존성 리뷰). 건너뛴 것과 실패한 것은 다른 말이다.
                  bad="$(jq '[.[] | select(.result == "failure" or .result == "cancelled")] | length' <<<"$NEEDS")"
                  test "$bad" = "0" || { echo "::error::선행 잡 $bad 개가 통과하지 않았다"; exit 1; }
                  echo "게이트 통과"
