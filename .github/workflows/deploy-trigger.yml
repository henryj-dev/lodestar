# 배포 트리거 — **배포로 가는 유일한 출입구**
#
# 여기서만 배포가 시작된다. 실제 배포 단계는 `deploy.yml` 에 있고 그 파일에는
# `workflow_call` 밖에 없다 — Actions 탭에도 안 뜨고 `gh workflow run` 으로도 못
# 부른다. 검증을 건너뛴 배포 경로가 **구조적으로 존재하지 않게** 하기 위해서다.
#
# **왜 main push 자동 배포를 그만두는가.** 자동 배포는 "main = 프로덕션" 이라는
# 불변식 하나를 주는 대신, 되돌릴 방법을 revert 커밋 하나로 좁힌다 — 그 길은 CI 를
# 한 바퀴 더 돌아야 열린다. 수동으로 두면 롤백이 배포와 **같은 경로**가 된다:
# 이전 태그나 SHA 를 `ref` 에 넣고 다시 돌리면 끝이다.
#
# 대신 잃는 것이 있다 — **main 과 프로덕션이 벌어지고, 벌어진 것을 아무도 안 본다.**
# 그래서 `deploy-drift.yml` 이 주 1회 그 간격을 잰다. 그게 없으면 몇 주 뒤
# "무엇이 떠 있는지 모르는" 상태가 된다.

name: Deploy trigger

on:
    workflow_dispatch:
        inputs:
            ref:
                description: "배포할 태그 또는 커밋 SHA (비우면 main 의 끝)"
                required: false
                type: string
            reason:
                description: "왜 지금 배포하는가 (실행 기록에 남는다)"
                required: true
                type: string

permissions:
    contents: read

jobs:
    vet:
        name: vet
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            sha: ${{ steps.resolve.outputs.sha }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # `merge-base` 로 조상 여부를 보려면 이력이 다 있어야 한다.
                  fetch-depth: 0
                  persist-credentials: false

            - name: ref 를 SHA 로 확정하고, 그것이 main 위에 있는지 본다
              id: resolve
              # `${{ }}` 를 `run:` 본문에 박지 않는다 — 그 자리는 셸이 스크립트를 보기
              # 전에 통째로 치환된다. 여기 오는 값은 사람이 폼에 직접 적는 문자열이다.
              env:
                  REF: ${{ inputs.ref }}
                  REASON: ${{ inputs.reason }}
              run: |
                  set -euo pipefail
                  echo "사유: $REASON"
                  sha="$(git rev-parse --verify "${REF:-origin/main}^{commit}")"
                  # **main 의 조상이어야 한다.** 아니면 리뷰를 거치지 않은 커밋이다.
                  git merge-base --is-ancestor "$sha" origin/main \
                    || { echo "::error::$sha 는 main 의 조상이 아니다 — 게이트를 지나지 않은 커밋이다"; exit 1; }
                  echo "sha=$sha" >> "$GITHUB_OUTPUT"
                  echo "배포 대상: $sha"

            # **이 커밋이 게이트를 통과한 적이 있는가.** 수동 실행은 "실수로 나가는
            # 것" 을 막지, "잘못된 것이 나가는 것" 을 막지 않는다 — 그건 여기서 막는다.
            - name: 이 커밋의 gate 가 초록이었나
              env:
                  GH_TOKEN: ${{ github.token }}
                  SHA: ${{ steps.resolve.outputs.sha }}
              run: |
                  set -euo pipefail
                  runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" \
                            --jq '[.check_runs[] | select(.name == "gate")]')"
                  test "$(jq length <<<"$runs")" -gt 0 \
                    || { echo "::error::이 커밋에서 gate 가 돈 적이 없다"; exit 1; }
                  jq -r '.[] | "  \(.name): \(.status)/\(.conclusion // "-")"' <<<"$runs"
                  bad="$(jq '[.[] | select(.conclusion != "success")] | length' <<<"$runs")"
                  test "$bad" = "0" || { echo "::error::gate 가 성공이 아니다 — ${bad}개 미통과"; exit 1; }
                  echo "gate 통과 확인"

    deploy:
        needs: vet
        uses: ./.github/workflows/deploy.yml
        with:
            sha: ${{ needs.vet.outputs.sha }}
        # **시크릿을 넘기지 않는다.** `secrets: inherit` 은 이 저장소의 모든 시크릿을
        # 통째로 넘기는 것이라, 무엇이 필요한지 읽어서는 알 수 없게 된다. 배포
        # 자격증명은 `production` 환경에 두고, 그 환경을 선언한 잡에서만 풀리게 한다.
