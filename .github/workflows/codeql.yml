name: CodeQL

on:
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 1 * * *" # 매일 오전 10시 (KST)

# 최상위 기본값을 읽기로 못 박는다. 없으면 저장소 기본값을 따라가고,
# 그 값은 이 파일을 읽어서는 알 수 없다.
permissions:
    contents: read

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        permissions:
            security-events: write
            actions: read
            contents: read

        strategy:
            fail-fast: false
            matrix:
                language: [javascript-typescript]

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # 체크아웃이 남기는 자격증명을 `.git/config` 에 두지 않는다.
                  # 이 잡은 분석만 하고 네트워크로 나갈 일이 없다.
                  persist-credentials: false

            - name: Initialize CodeQL
              uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
              with:
                  languages: ${{ matrix.language }}
                  queries: security-extended
                  config-file: .github/codeql/codeql-config.yml

            - name: Autobuild
              uses: github/codeql-action/autobuild@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
              with:
                  category: "/language:${{ matrix.language }}"

    # **브랜치 규칙이 거는 이름은 이것 하나다.** 매트릭스 값이 체크 이름에 붙으므로
    # (`Analyze (javascript-typescript)`) 언어를 하나 늘리면 규칙에 적어 둔 이름과
    # 어긋나고, 그러면 보호는 조용히 사라진다.
    #
    # ⚠️ 이 체크가 묻는 것은 "분석이 돌았는가" 이지 "경고가 없는가" 가 아니다.
    #    경고는 Security 탭에 쌓이고 머지를 막지 않는다.
    codeql:
        name: codeql
        needs: [analyze]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: 분석이 돌았는가
              env:
                  RESULT: ${{ needs.analyze.result }}
              run: |
                  set -euo pipefail
                  echo "analyze: $RESULT"
                  test "$RESULT" = "success" \
                    || { echo "::error::CodeQL 분석이 끝까지 돌지 않았다 ($RESULT)"; exit 1; }
